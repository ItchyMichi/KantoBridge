# Run from tools/: .venv/Scripts/python.exe -m pytest -c pytest.ini --rootdir .
# (tools/check.ps1 and tools/check.sh do that, then run the Gradle build).
# faulthandler is off because LuaJIT on Windows raises an SEH exception for every Lua error(),
# which faulthandler would print as a "Windows fatal exception".
[pytest]
testpaths = tests lua e2e
norecursedirs = .venv .git refs local build .gradle node_modules __pycache__
pythonpath = .
timeout = 120
addopts = -ra --strict-markers -p no:cacheprovider -p no:faulthandler
markers =
    e2e: needs the real Gen1Recomp test instance (local/gen1recomp-e2e); runs only with --e2e
    lua: runs gen1-bridge Lua under lupa (LuaJIT 2.1)
