plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	// There are no Kotlin sources. Loom remaps the Kotlin metadata of Kotlin mods only when this plugin is applied;
	// without it, Cobblemon's metadata keeps intermediary names and its kotlin-reflect setup crashes in every dev
	// runtime (GameTest, runServer, runClient) with ClassNotFoundException: net.minecraft.class_2960.
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
		content { includeGroup 'org.parchmentmc.data' }
	}
	maven {
		// Cobblemon's own release repository (also mirrored at maven.impactdev.net/repository/development/).
		name = 'Cobblemon'
		url = 'https://artefacts.cobblemon.com/releases'
		content { includeGroup 'com.cobblemon' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kantobridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// The dev client and the headless server share local/minecraft (git-ignored): saves, generated
		// packs and exports stay there, next to the user's own eula.txt (docs/PLAN.md §0.6, §4.5).
		client {
			runDir "../local/minecraft"
		}
		server {
			runDir "../local/minecraft"
		}
	}
}

// Rendering measurements (docs/specs/VOXEL_BLOCKS_PLAN.md §10): `./gradlew runClient -Pkb.meshstats=true` turns on the dev-only
// MeshStats counters and its timing mixin; F8 in game appends a run to local/reports/mesh_report.json (numbers only).
def kbMeshStats = providers.gradleProperty("kb.meshstats").getOrElse("false") == "true"
if (kbMeshStats) {
	loom {
		runs {
			client {
				vmArg "-Dkantobridge.meshstats=true"
				vmArg "-Dkantobridge.meshstats.report=${file('../local/reports/mesh_report.json').absolutePath}"
			}
		}
	}
}

// Recorded showcases and Wild Routes check C5 (docs/specs/WILD_ROUTES_PLAN.md §8): `./gradlew runClient -Pkb.autopilot=wild_zone
// [-Pkb.autopilotWorld=<level folder>] [-Pkb.autopilotRecord=<file.mp4>] [-Pkb.autopilotQuit=true] [-Pkb.autopilotPort=<port>]`
// lets the dev-only Autopilot (client/dev/Autopilot.java) play its scene in a 1280x720 window, recording it with ffmpeg; its
// steps go to local/reports/autopilot.log (ids, cells, counts). Agents run it on the pod under Xvfb: tools/e2e/showcase.py.
def kbAutopilot = providers.gradleProperty("kb.autopilot").getOrNull()
if (kbAutopilot != null && !kbAutopilot.isBlank()) {
	def kbAutopilotWorld = providers.gradleProperty("kb.autopilotWorld").getOrNull()
	def kbAutopilotRecord = providers.gradleProperty("kb.autopilotRecord").getOrNull()
	def kbAutopilotPort = providers.gradleProperty("kb.autopilotPort").getOrNull()
	loom {
		runs {
			client {
				vmArg "-Dkantobridge.autopilot=${kbAutopilot.trim()}"
				vmArg "-Dkantobridge.autopilot.log=${file('../local/reports/autopilot.log').absolutePath}"
				vmArg "-Dkantobridge.autopilot.quit=${providers.gradleProperty('kb.autopilotQuit').getOrElse('false')}"
				if (kbAutopilotWorld != null && !kbAutopilotWorld.isBlank()) {
					vmArg "-Dkantobridge.autopilot.world=${kbAutopilotWorld.trim()}"
				}
				if (kbAutopilotRecord != null && !kbAutopilotRecord.isBlank()) {
					vmArg "-Dkantobridge.autopilot.record=${file(kbAutopilotRecord.trim()).absolutePath}"
				}
				if (kbAutopilotPort != null && !kbAutopilotPort.isBlank()) {
					vmArg "-Dkantobridge.port=${kbAutopilotPort.trim()}"
				}
				// the caves and woods plan's tour (Autopilot scene "tour"): how many stops it looks round at
				vmArg "-Dkantobridge.autopilot.stops=${providers.gradleProperty('kb.autopilotStops').getOrElse('2')}"
				programArgs "--width", "1280", "--height", "720"
			}
		}
	}
}

// A second dev client for multiplayer play-tests (docs/PLAN.md §6 M9): `./gradlew runClient2` starts "Player2" in its own
// game folder, ../local/minecraft-p2 (its own options, generated pack and export), linked to a second Gen1Recomp whose
// gen1-bridge listens on port 27152. Agents never start it; the user does.
loom {
	runs {
		client2 {
			inherit(loom.runs.getByName("client"))
			name "Minecraft Client 2 (Player2)"
			runDir "../local/minecraft-p2"
			programArgs "--username", "Player2"
			vmArg "-Dkantobridge.port=27152"
		}
	}
}

// Server GameTests run headless in build/run/gameTest and are part of `check` (so of `build`).
// There is no client GameTest module on 1.21.1.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "kantobridge-gametest"
		enableClientGameTests = false
	}
}

loom {
	runs {
		gameTest {
			vmArg "-Dfabric-api.gametest.report-file=${file('build/reports/gametest/TEST-gametest.xml').absolutePath}"
		}
	}
}

// Headless world builds (docs/PLAN.md §4.5): `./gradlew runServer -Pkb.build=<bundle dir> [-Pkb.buildMaps=A,B]
// [-Pkb.buildReport=<path>] [-Pkb.buildExit=true]` hands these to the server as -Dkantobridge.build* (HeadlessBuild).
// Relative paths resolve against this project directory. Added after the GameTest run is configured, so the GameTest
// server (which inherits the server run) never gets them.
def kbBuildProperties = [
	"kb.build"      : ["kantobridge.build", true],
	"kb.buildMaps"  : ["kantobridge.build.maps", false],
	"kb.buildReport": ["kantobridge.build.report", true],
	"kb.buildExit"  : ["kantobridge.build.exit", false],
]
def kbBuildVmArgs = []
kbBuildProperties.each { gradleName, spec ->
	def value = providers.gradleProperty(gradleName).getOrNull()
	if (value != null && !value.isBlank()) {
		def resolved = spec[1] ? file(value).absolutePath : value
		kbBuildVmArgs << "-D${spec[0]}=${resolved}"
	}
}
loom {
	runs {
		server {
			kbBuildVmArgs.each { vmArg it }
		}
	}
}

// Headless export (docs/PLAN.md §4.5 "ExportBundle"): `./gradlew exportCli -Pkb.exportPort=<port> -Pkb.exportOut=<dir>
// [-Pkb.exportTimeout=<seconds>]` downloads gen1-bridge's export as role builder into <dir>/<game>/ with ExportCli (plain
// Java, no Minecraft). <dir> defaults to the dev game folder's export folder; relative paths resolve against this project
// directory. It prints one `export:` line and fails the task when the export fails.
def kbExportArgs = []
def kbExportPort = providers.gradleProperty("kb.exportPort").getOrNull()
if (kbExportPort != null && !kbExportPort.isBlank()) {
	kbExportArgs += ["--port", kbExportPort.trim()]
}
def kbExportOut = providers.gradleProperty("kb.exportOut").getOrNull()
kbExportArgs += ["--out", file(kbExportOut != null && !kbExportOut.isBlank() ? kbExportOut.trim() : "../local/minecraft/kantobridge/export").absolutePath]
def kbExportTimeout = providers.gradleProperty("kb.exportTimeout").getOrNull()
if (kbExportTimeout != null && !kbExportTimeout.isBlank()) {
	kbExportArgs += ["--timeout", kbExportTimeout.trim()]
}
def kbExportWorkDir = layout.buildDirectory.dir("exportCli").get().asFile
// Mojang's logging jar on this classpath ships a log4j2.xml that prints INFO to stdout; the CLI's stdout is its one
// summary line, so its own config keeps warnings only, on stderr, never starting with "export:".
def kbExportLogConfig = new File(kbExportWorkDir, "log4j2-exportcli.xml")
tasks.register("exportCli", JavaExec) {
	group = "kantobridge"
	description = "Downloads gen1-bridge's world export into an export bundle (headless)."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "dev.kantobridge.client.bridge.ExportCli"
	args kbExportArgs
	systemProperty "kantobridge.modVersion", project.version.toString()
	systemProperty "kantobridge.minecraftVersion", project.minecraft_version.toString()
	systemProperty "log4j2.configurationFile", kbExportLogConfig.absolutePath
	// Nothing should land in the source tree, even if a library decides to write logs.
	workingDir = kbExportWorkDir
	doFirst {
		kbExportWorkDir.mkdirs()
		kbExportLogConfig.setText("""<?xml version="1.0" encoding="UTF-8"?>
<Configuration status="error">
  <Appenders>
    <Console name="stderr" target="SYSTEM_ERR"><PatternLayout pattern="[%level] %logger: %msg%n"/></Console>
  </Appenders>
  <Loggers>
    <Root level="warn"><AppenderRef ref="stderr"/></Root>
  </Loggers>
</Configuration>
""", "UTF-8")
	}
}

// Dev runtimes only. Minecraft lists ICU4J as a client library, so Loom strips it from server-side runs, but
// Cobblemon's Showdown engine (GraalJS) needs it on the server: without it the server waits for Showdown forever.
// Real servers get the copy bundled in Cobblemon's jar; this adds that same version (Cobblemon 1.8.1's POM).
def serverRuntimeIcu = configurations.detachedConfiguration(dependencies.create("com.ibm.icu:icu4j:${project.cobblemon_icu4j_version}"))
serverRuntimeIcu.transitive = false
sourceSets.main.runtimeClasspath += serverRuntimeIcu      // runServer
sourceSets.gametest.runtimeClasspath += serverRuntimeIcu  // runGameTest

/**
 * Fails when a mixin injector in the remapped jar still names its target method in Mojang names. Loom 1.17 remaps
 * mixins with tiny-remapper (no refmap); a target it can't resolve keeps its dev name, works in dev and GameTests,
 * and only breaks in a real game. Injectors with remap = false (targets in non-Minecraft code) are skipped.
 */
abstract class VerifyMixinRemap extends DefaultTask {
	private static final Set<String> INJECTORS = [
		"Lorg/spongepowered/asm/mixin/injection/Inject;",
		"Lorg/spongepowered/asm/mixin/injection/Redirect;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyArg;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyArgs;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyConstant;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyVariable;",
		"Lcom/llamalad7/mixinextras/injector/ModifyExpressionValue;",
		"Lcom/llamalad7/mixinextras/injector/ModifyReturnValue;",
		"Lcom/llamalad7/mixinextras/injector/WrapWithCondition;",
		"Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
		"Lcom/llamalad7/mixinextras/injector/wrapmethod/WrapMethod;",
	] as Set

	@InputFile
	abstract RegularFileProperty getJarFile()

	@Input
	abstract Property<String> getMixinPackage()

	@OutputFile
	abstract RegularFileProperty getReport()

	@TaskAction
	void verify() {
		def checked = []
		def failures = []
		new java.util.zip.ZipFile(getJarFile().get().asFile).withCloseable { zip ->
			zip.entries().each { entry ->
				if (!entry.name.startsWith(getMixinPackage().get()) || !entry.name.endsWith(".class")) {
					return
				}
				def node = new org.objectweb.asm.tree.ClassNode()
				new org.objectweb.asm.ClassReader(zip.getInputStream(entry).bytes).accept(node, org.objectweb.asm.ClassReader.SKIP_CODE)
				node.methods.each { method ->
					((method.visibleAnnotations ?: []) + (method.invisibleAnnotations ?: [])).each { annotation ->
						if (!INJECTORS.contains(annotation.desc)) {
							return
						}
						def values = [:]
						def raw = annotation.values ?: []
						for (int i = 0; i + 1 < raw.size(); i += 2) {
							values[raw[i]] = raw[i + 1]
						}
						if (values.remap == false) {
							return
						}
						(values.method ?: []).each { String target ->
							def where = "${node.name}.${method.name} -> ${target}"
							checked << where
							if (!(target ==~ /.*\bmethod_\d+.*/ || target.startsWith("<init>") || target.startsWith("<clinit>"))) {
								failures << where
							}
						}
					}
				}
			}
		}
		getReport().get().asFile.text = (checked.collect { "ok " + it } + failures.collect { "UNMAPPED " + it }).join("\n") + "\n"
		if (!failures.isEmpty()) {
			throw new GradleException("mixin targets were not remapped and would fail in a real game:\n  " + failures.join("\n  "))
		}
		if (checked.isEmpty()) {
			throw new GradleException("no mixin injectors found under " + getMixinPackage().get())
		}
		logger.lifecycle("Mixin remap check: ${checked.size()} injector target(s) remapped")
	}
}

def verifyMixinRemap = tasks.register("verifyMixinRemap", VerifyMixinRemap) {
	group = "verification"
	description = "Checks that every mixin injector target in the remapped jar was remapped."
	jarFile = tasks.named("remapJar").flatMap { it.archiveFile }
	mixinPackage = "dev/kantobridge/mixin/"
	report = layout.buildDirectory.file("reports/mixin-remap.txt")
}
tasks.named("check") {
	dependsOn verifyMixinRemap
}

/**
 * Complements verifyMixinRemap: the @At targets inside injector annotations (INVOKE, FIELD, NEW, ...) and the method
 * targets of injectors that task doesn't list (MixinExtras' v2 annotations) must be remapped too. A target that still
 * names a Mojang-named Minecraft type or member works in dev and GameTests and only breaks in a real game.
 */
abstract class VerifyMixinTargets extends DefaultTask {
	private static final Set<String> INJECTORS = [
		"Lorg/spongepowered/asm/mixin/injection/Inject;",
		"Lorg/spongepowered/asm/mixin/injection/Redirect;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyArg;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyArgs;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyConstant;",
		"Lorg/spongepowered/asm/mixin/injection/ModifyVariable;",
		"Lcom/llamalad7/mixinextras/injector/ModifyExpressionValue;",
		"Lcom/llamalad7/mixinextras/injector/ModifyReceiver;",
		"Lcom/llamalad7/mixinextras/injector/ModifyReturnValue;",
		"Lcom/llamalad7/mixinextras/injector/WrapWithCondition;",
		"Lcom/llamalad7/mixinextras/injector/v2/WrapWithCondition;",
		"Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
		"Lcom/llamalad7/mixinextras/injector/wrapmethod/WrapMethod;",
	] as Set
	/** Mojang names left in a remapped descriptor: Minecraft's own packages (intermediary is net/minecraft/class_N). */
	private static final java.util.regex.Pattern MOJANG_TYPE = ~/L(net\/minecraft\/(?!class_)|com\/mojang\/(blaze3d|math|realmsclient)\/)/
	private static final java.util.regex.Pattern MAPPED_MEMBER = ~/(method|field)_\d+|<init>|<clinit>/

	@InputFile
	abstract RegularFileProperty getJarFile()

	@Input
	abstract Property<String> getMixinPackage()

	@OutputFile
	abstract RegularFileProperty getReport()

	/** Null when an @At {@code target} is remapped, else why not. */
	static String atProblem(String target) {
		if (MOJANG_TYPE.matcher(target).find()) {
			return "a Mojang type name"
		}
		if (target.startsWith("Lnet/minecraft/class_")) {
			int semi = target.indexOf(';')
			String member = target.substring(semi + 1).split("[(:]", 2)[0]
			if (!member.isEmpty() && !(member ==~ MAPPED_MEMBER)) {
				return "a Mojang member name"
			}
		}
		return null
	}

	/** Null when an injector's {@code method} target is remapped, else why not. */
	static String methodProblem(String target) {
		if (MOJANG_TYPE.matcher(target).find()) {
			return "a Mojang type name"
		}
		if (!(target ==~ /.*\bmethod_\d+.*/ || target.startsWith("<init>") || target.startsWith("<clinit>"))) {
			return "a Mojang method name"
		}
		return null
	}

	@TaskAction
	void verify() {
		def checked = []
		def failures = []
		new java.util.zip.ZipFile(getJarFile().get().asFile).withCloseable { zip ->
			zip.entries().each { entry ->
				if (!entry.name.startsWith(getMixinPackage().get()) || !entry.name.endsWith(".class")) {
					return
				}
				def node = new org.objectweb.asm.tree.ClassNode()
				new org.objectweb.asm.ClassReader(zip.getInputStream(entry).bytes).accept(node, org.objectweb.asm.ClassReader.SKIP_CODE)
				node.methods.each { method ->
					((method.visibleAnnotations ?: []) + (method.invisibleAnnotations ?: [])).each { annotation ->
						if (!INJECTORS.contains(annotation.desc)) {
							return
						}
						def values = [:]
						def raw = annotation.values ?: []
						for (int i = 0; i + 1 < raw.size(); i += 2) {
							values[raw[i]] = raw[i + 1]
						}
						if (values.remap == false) {
							return
						}
						def check = { String target, String why ->
							def where = "${node.name}.${method.name} -> ${target}"
							checked << where
							if (why != null) {
								failures << "${where} (${why})"
							}
						}
						(values.method ?: []).each { String target -> check(target, methodProblem(target)) }
						def ats = values.at instanceof List ? values.at : (values.at == null ? [] : [values.at])
						ats.each { at ->
							def atValues = [:]
							def atRaw = at.values ?: []
							for (int i = 0; i + 1 < atRaw.size(); i += 2) {
								atValues[atRaw[i]] = atRaw[i + 1]
							}
							if (atValues.remap != false && atValues.target != null) {
								check(atValues.target as String, atProblem(atValues.target as String))
							}
						}
					}
				}
			}
		}
		getReport().get().asFile.text = (checked.collect { "ok " + it } + failures.collect { "UNMAPPED " + it }).join("\n") + "\n"
		if (!failures.isEmpty()) {
			throw new GradleException("mixin targets were not remapped and would fail in a real game:\n  " + failures.join("\n  "))
		}
		logger.lifecycle("Mixin target check: ${checked.size()} method and @At target(s) remapped")
	}
}

def verifyMixinTargets = tasks.register("verifyMixinTargets", VerifyMixinTargets) {
	group = "verification"
	description = "Checks that every @At target (and MixinExtras v2 method target) in the remapped jar was remapped."
	jarFile = tasks.named("remapJar").flatMap { it.archiveFile }
	mixinPackage = "dev/kantobridge/mixin/"
	report = layout.buildDirectory.file("reports/mixin-targets.txt")
}
tasks.named("check") {
	dependsOn verifyMixinTargets
}

// Loom only clears the client GameTest directory, so drop the previous server test world ourselves.
def cleanGameTestWorld = tasks.register("cleanGameTestWorld", Delete) {
	group = "verification"
	description = "Deletes the world left by the previous server GameTest run."
	delete layout.buildDirectory.dir("run/gameTest/world")
}
tasks.matching { it.name == "runGameTest" }.configureEach {
	dependsOn cleanGameTestWorld
	// A server that never finishes starting (e.g. a broken Cobblemon dependency) must fail the build, not hang it.
	timeout = java.time.Duration.ofMinutes(15)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang's official mappings, with Parchment layered on top for parameter names and javadoc. Never Yarn.
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon (Fabric build). Its POM also pulls in the libraries it bundles (GraalJS, ICU4J, MongoDB driver).
	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
	// Kotlin runtime Cobblemon needs on Fabric. Cobblemon bundles this exact version; pinned here explicitly.
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// JUnit 5 inside Fabric Loader (Knot), so mixins apply in unit tests. Same version as the loader.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// ---- Protocol: the catalog in ../protocol is the single source of message types ----

// The derived protocol catalog (docs/PROTOCOL.md). -Pkb.catalog=<path> points at another copy.
def protocolDir = layout.projectDirectory.dir("../protocol")
def catalogFile = layout.projectDirectory.file(providers.gradleProperty("kb.catalog").orElse("../protocol/catalog.json"))

/** Writes MsgTypes.java: one String constant per message type in the catalog. */
abstract class GenerateProtocolTypes extends DefaultTask {
	@InputFile
	@PathSensitive(PathSensitivity.NONE)
	abstract RegularFileProperty getCatalog()

	@OutputDirectory
	abstract DirectoryProperty getOutputDir()

	@TaskAction
	void generate() {
		def catalog = new groovy.json.JsonSlurper().parse(getCatalog().get().asFile)
		def types = (catalog.messages as Map).keySet().toList().sort()
		def names = [:]
		def lines = []
		types.each { String type ->
			def name = type.toUpperCase(Locale.ROOT).replace('.', '_')
			if (!(name ==~ /[A-Z][A-Z0-9_]*/)) throw new GradleException("protocol type '$type' gives an invalid constant name")
			if (names.containsKey(name)) throw new GradleException("protocol types '$type' and '${names[name]}' map to the same constant")
			names[name] = type
			def legs = (catalog.messages[type].legs as List).join(", ")
			lines << "\t/** {@code ${type}} (${legs}). */"
			lines << "\tpublic static final String ${name} = \"${type}\";"
		}
		def out = getOutputDir().get().asFile
		def pkg = new File(out, "dev/kantobridge/proto")
		out.deleteDir()
		pkg.mkdirs()
		def all = types.collect { "\t\t" + it.toUpperCase(Locale.ROOT).replace('.', '_') }.join(",\n")
		new File(pkg, "MsgTypes.java").setText("""\
// Generated from protocol/catalog.json by the generateProtocolTypes Gradle task. Do not edit.
package dev.kantobridge.proto;

import java.util.List;

/** Message type names of protocol ${catalog.protocol}, from protocol/catalog.json. */
public final class MsgTypes {
	/** The protocol number; hello and hello.ok must carry exactly this. */
	public static final int PROTOCOL = ${catalog.protocol as int};

${lines.join("\n")}

	/** Every type, sorted. */
	public static final List<String> ALL = List.of(
${all}
	);

	private MsgTypes() {
	}
}
""", "UTF-8")
	}
}

def generateProtocolTypes = tasks.register("generateProtocolTypes", GenerateProtocolTypes) {
	group = "build"
	description = "Generates MsgTypes.java from protocol/catalog.json."
	catalog = catalogFile
	outputDir = layout.buildDirectory.dir("generated/sources/protocol/java")
}

sourceSets.main.java.srcDir(generateProtocolTypes)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Bundle the catalog so both sides can check legs, reply rules and redaction at runtime.
	from(catalogFile) {
		into "kantobridge/protocol"
		rename { "catalog.json" }
	}
}

test {
	useJUnitPlatform()
	// Minecraft's logging writes logs/ into the working directory; keep it in build/, out of the source tree.
	workingDir = layout.buildDirectory
	// Tests read the real protocol examples and redaction vectors.
	inputs.dir(protocolDir).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("protocolDir")
	systemProperty "kb.protocolDir", protocolDir.asFile.absolutePath
	// Builder tests read the GameTests' synthetic export bundle and the golden WorldIndex beside it.
	def gametestResources = layout.projectDirectory.dir("src/gametest/resources")
	inputs.dir(gametestResources.dir("kantobridge")).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("gametestData")
	systemProperty "kb.gametestResources", gametestResources.asFile.absolutePath
	// -Pkb.updateGolden=true rewrites the golden WorldIndex instead of comparing against it.
	systemProperty "kb.updateGolden", providers.gradleProperty("kb.updateGolden").getOrElse("false")
	testLogging {
		events "failed", "skipped"
		exceptionFormat = "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// The repository's licence and credits (Gen1Recomp's required credit line among them) travel inside the jar.
	from(files("../LICENSE", "../CREDITS.md")) {
		rename { it == "LICENSE" ? "LICENSE_$projectName" : "CREDITS_${projectName}.md" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
