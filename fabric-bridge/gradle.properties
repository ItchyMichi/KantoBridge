# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# Pinned: see docs/VERSIONS.md (and where each value came from) before changing anything here.
minecraft_version=1.21.1
loader_version=0.19.5
# 1.17.21 is the newest Loom that runs on Java 21 (1.18+ needs Gradle on Java 25). See docs/VERSIONS.md.
loom_version=1.17.21
parchment_version=2024.11.17

# Mod Properties
version=0.1.0
group=dev.kantobridge

# Dependencies
fabric_api_version=0.116.17+1.21.1
cobblemon_version=1.8.1+1.21.1
fabric_kotlin_version=1.13.6+kotlin.2.2.20
# Kotlin Gradle plugin, only so Loom remaps Cobblemon's Kotlin metadata (build.gradle). Must equal the Kotlin
# version above (Cobblemon 1.8.1 is built with Kotlin 2.2.20).
kotlin_version=2.2.20
# Kotlin sources don't exist here; don't add kotlin-stdlib to our own dependencies.
kotlin.stdlib.default.dependency=false
# ICU4J as declared in Cobblemon 1.8.1's POM; only added to server-side dev runs (build.gradle).
cobblemon_icu4j_version=71.1
